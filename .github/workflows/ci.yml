name: portfolio-ci

on:
  push:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'docker-compose.yml'
      - 'edge-audio-anomaly-service/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'docker-compose.yml'
      - 'edge-audio-anomaly-service/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  edge-audio:
    name: edge-audio-anomaly-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-audio-anomaly-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: edge-audio-anomaly-service/pyproject.toml

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python -m pytest -q

      - name: Run audio demo
        run: python scripts/run_audio_demo.py

      - name: Evaluate public-audio fixture
        run: python scripts/evaluate_public_audio_dataset.py

      - name: Benchmark deployment backends
        run: python scripts/benchmark_model_backends.py

      - name: Validate Docker Compose config
        working-directory: ${{ github.workspace }}
        run: docker compose config
