name: portfolio-ci

on:
  push:
    paths:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - 'docker-compose.yml'
      - 'edge-audio-anomaly-service/**'
      - 'edge-ai-maintenance-gateway/**'
      - 'edge-vision-inspection/**'
      - 'edgebench/**'
      - 'smoke-test.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - 'docker-compose.yml'
      - 'edge-audio-anomaly-service/**'
      - 'edge-ai-maintenance-gateway/**'
      - 'edge-vision-inspection/**'
      - 'edgebench/**'
      - 'smoke-test.sh'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  python-projects:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: edge-audio-anomaly-service
            install: ".[api]"
            demo: |
              python scripts/run_audio_demo.py
              python scripts/evaluate_public_audio_dataset.py
              python scripts/benchmark_model_backends.py
          - project: edge-ai-maintenance-gateway
            install: ".[api]"
            demo: python scripts/run_gateway_demo.py
          - project: edge-vision-inspection
            install: ".[api]"
            demo: python scripts/run_vision_demo.py
          - project: edgebench
            install: "."
            demo: python -m edgebench run --builtin centroid --input-size 8 --warmup 2 --repeat 5
    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ${{ matrix.project }}/pyproject.toml

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "${{ matrix.install }}"
          python -m pip install pytest ruff

      - name: Lint
        run: |
          paths="src tests"
          if [ -d scripts ]; then paths="$paths scripts"; fi
          ruff check $paths --select E,F,W,B --ignore E501,E402,B008

      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONIOENCODING: 'utf-8'
        run: python -m pytest -q

      - name: Run demo
        run: ${{ matrix.demo }}

  docker-compose:
    name: docker-compose-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose config
        working-directory: ${{ github.workspace }}
        run: docker compose config
