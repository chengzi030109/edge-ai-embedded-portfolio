[project]
name = "edge-audio-anomaly-service"
version = "0.1.0"
description = "Embedded Linux audio anomaly service demo"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10.0"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
