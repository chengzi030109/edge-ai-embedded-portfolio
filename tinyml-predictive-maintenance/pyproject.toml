[project]
name = "tinyml-predictive-maintenance"
version = "0.1.0"
description = "Hardware-free TinyML predictive maintenance prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# The default install stays tiny so a reviewer can inspect or run the synthetic
# path without pulling a 600 MB PyTorch stack. Use ``pip install -e .[full]``
# when you want CWRU loaders, sklearn baselines, autoencoder ONNX export, and
# publication-style figures.
full = [
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "torch>=2.0",
    "onnx>=1.14",
    "onnxruntime>=1.16",
    "matplotlib>=3.7",
    "pillow>=10.0",
]
reports = ["matplotlib>=3.7", "pillow>=10.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Default rule set is fine but we whitelist a small set focused on real bugs,
# unused imports, and obvious mistakes — not style nitpicks. Ruff's defaults
# already include these; we just disable a few that fight the existing code.
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # line length is enforced loosely; existing code has long URLs/messages.
    "E402",  # ``sys.path`` insert before imports is intentional in scripts/.
    "B008",  # ``Path(...)`` as default value is fine for our small CLIs.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # plain ``assert`` is the point in test files.
